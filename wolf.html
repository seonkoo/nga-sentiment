<script>
async function getJSON(u) {
  const r = await fetch(u + "?v=" + Date.now());
  if (!r.ok) throw new Error(u + " " + r.status);
  return r.json();
}
function esc(s){ return String(s||"").replace(/[&<>"']/g, c=>({'&':'&amp;','<':'<','>':'>','"':'&quot;',"'":'&#39;'}[c])); }
function biasPill(b){
  if (b === "bull") return '<span class="pill pill-bull">看多</span>';
  if (b === "bear") return '<span class="pill pill-bear">看空</span>';
  return '<span class="pill pill-neutral">中性</span>';
}
function renderAnalysis(a){
  if (!a) return "";
  const kv = (k,v) => `<div class="kv"><span class="k">${k}</span><span class="v">${esc(v)}</span></div>`;
  const b = a.bias || {};
  return `
  <div class="card">
    <h2>🤖 智谱解读 <span class="tag">${a.disclaimer ? "AI 归纳" : ""}</span></h2>
    ${kv("核心观点", a.core_view)}
    ${kv("多空倾向", (b.bias||"") + (b.confidence!==undefined ? "（置信度 " + b.confidence + "）" : "") + biasPill(b.bias))}
    ${kv("操作策略", a.strategy)}
    ${kv("风险提示", a.risk)}
    ${a.disclaimer ? `<div class="disclaim">${esc(a.disclaimer)}</div>` : ""}
  </div>`;
}
function renderPosts(d){
  const posts = (d.posts||[]).slice().reverse();
  const items = posts.map((p,i) => `
    <div class="post">
      <div class="h">#${posts.length-i} ${esc(p.subject||"（无标题）")}</div>
      <div class="c">${esc(p.content)}</div>
    </div>`).join("");
  return `
  <div class="card">
    <h2>🐺 啊狼发言合集 <span class="tag">${posts.length} 条（新→旧）</span></h2>
    ${items || '<div class="err">暂无发言</div>'}
    <div style="margin-top:12px"><button class="copy-btn" id="copyAll">📋 复制全部发言</button> <button class="copy-btn" id="dlTxt">⬇️ 下载 TXT</button></div>
  </div>`;
}
async function main(){
  const app = document.getElementById("app");
  const upd = document.getElementById("updated");
  try {
    const posts = EMBED_POSTS || null;
    const ana = EMBED_ANALYSIS || null;
    if (!posts) throw new Error("wolf_posts.json 缺失，请先跑 wolf_fetch.py");
    upd.textContent = `采集于 ${posts.fetched_at||""} ｜ ${posts.posts?.length||0} 条发言`
      + (ana && ana.analyzed_at ? ` ｜ 解读于 ${ana.analyzed_at}` : " ｜ 未启用智谱");
    let html = "";
    if (ana && ana.analysis) html += renderAnalysis(ana.analysis);
    else if (ana && ana.note) html += `<div class="card"><div class="err">${esc(ana.note)}</div></div>`;
    html += renderPosts(posts);
    app.innerHTML = html;
    const btn = document.getElementById("copyAll");
    if (btn) btn.onclick = async () => {
      const txt = (posts.posts||[]).map((p,i)=>`【${i+1}】${p.subject||""}\n${p.content}`).join("\n\n");
      try { await navigator.clipboard.writeText(txt); btn.textContent = "已复制 ✅"; }
      catch { btn.textContent = "复制失败，请长按选择"; }
    };
  } catch(e){
    app.innerHTML = `<div class="card"><div class="err">加载失败：${esc(e.message)}</div></div>`;
    upd.textContent = "加载失败";
  }
}
main();

    const dl = document.getElementById("dlTxt");
    if (dl) dl.onclick = () => {
      const lines = [];
      lines.push("NGA 狼大发言合集");
      lines.push("来源: " + (posts.url||""));
      lines.push("采集: " + (posts.fetched_at||"") + " | 共 " + (posts.posts?.length||0) + " 条");
      lines.push("==============================================");
      (posts.posts||[]).forEach((p,i) => {
        lines.push("【" + (i+1) + "】" + (p.subject||""));
        lines.push(p.content);
        lines.push("");
        lines.push("----------------------------------------------");
        lines.push("");
      });
      const blob = new Blob([lines.join("\n")], {type:"text/plain;charset=utf-8"});
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "wolf_posts.txt";
      a.click();
      URL.revokeObjectURL(a.href);
      dl.textContent = "已导出 ✅";
    };

</script>
