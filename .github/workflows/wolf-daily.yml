name: Wolf Daily Auto-fetch
# 云端全自动: 每天抓取狼大全部发言 -> 智谱解读 -> 打包单文件 -> 推 Pages
on:
  schedule:
    - cron: '30 13 * * *'   # 每天 21:30 北京时间 (13:30 UTC)
  workflow_dispatch:        # 手动触发一次

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Chrome (headless 抓取 NGA 必需)
        run: |
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get update -qq
          sudo apt-get install -yqq ./google-chrome-stable_current_amd64.deb >/dev/null
          google-chrome-stable --version

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 环境自检 (chrome + NGA 可达性)
        run: |
          google-chrome-stable --version
          timeout 90 google-chrome-stable --headless --disable-gpu --no-sandbox \
            --disable-dev-shm-usage --virtual-time-budget=15000 \
            --dump-dom "https://ngabbs.com/read.php?tid=47288722&authorid=150058" \
            > /tmp/probe.html 2>/tmp/probe.err || echo "chrome rc=$?"
          echo "probe size: $(wc -c </tmp/probe.html)"
          echo "拦截页标志: $(grep -c '访客不能直接访问' /tmp/probe.html)"
          echo "--- chrome stderr ---"
          head -c 500 /tmp/probe.err || true

      - name: 全页抓取狼大发言 (自动检测页数)
        run: |
          cd scraper
          python wolf_fetch.py --out ../data/wolf_posts.json --txt ../data/wolf_posts.txt

      - name: 智谱解读 (未配 Key 时优雅跳过)
        env:
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
        run: |
          cd scraper
          python zhipu_analyze.py

      - name: 打包自包含单文件页
        run: |
          cd scraper
          python build_standalone.py

      - name: 提交并推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add wolf.html data scraper
          git commit -m "auto: 每日自动抓取狼大发言 ($(date +%F))" || echo "无变化"
          git push
