name: Wolf Daily Auto-fetch
# 云端全自动: 每天抓取狼大全部发言 -> 智谱解读 -> 打包单文件 -> 推 Pages
# 抓取用 playwright 真浏览器(NGA guestJs 自动重载, headless --dump-dom 在云端 IP 被拦)
on:
  schedule:
    - cron: '30 13 * * *'   # 每天 21:30 北京时间 (13:30 UTC)
  workflow_dispatch:        # 手动触发一次

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装 playwright + chromium
        run: |
          set -e
          pip install playwright -q
          python -m playwright install chromium --with-deps
          python -c "from playwright.sync_api import sync_playwright; print('✅ playwright OK')"

      - name: 全页抓取狼大发言 (自动检测页数)
        run: |
          cd scraper
          python fetch_playwright.py --out ../data/wolf_posts.json --txt ../data/wolf_posts.txt \
            2>&1 | tee /tmp/fetch.log
          rc=${PIPESTATUS[0]}
          echo "fetch_rc=$rc" > /tmp/diag.txt
          if [ $rc -ne 0 ]; then tail -40 /tmp/fetch.log >> /tmp/diag.txt; fi
          exit $rc

      - name: 上传诊断到 repo (调试用, 定位后删除)
        if: always() && hashFiles('/tmp/diag.txt') != ''
        run: |
          cp /tmp/diag.txt diag.txt || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add diag.txt
          git commit -m "debug: playwright 抓取诊断" || echo "无变化"
          git push

      - name: 智谱解读 (未配 Key 时优雅跳过)
        env:
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
        run: |
          cd scraper
          python zhipu_analyze.py

      - name: 打包自包含单文件页
        run: |
          cd scraper
          python build_standalone.py

      - name: 提交并推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add wolf.html data scraper
          git commit -m "auto: 每日自动抓取狼大发言 ($(date +%F))" || echo "无变化"
          git push
